[workspace]
resolver = "2"
members = ["crates/x0k-ui-protocol", "crates/x0k-ui-endpoint", "crates/x0k-operation-session", "crates/x0k-operation-wire", "crates/x0k-runtime-dir", "crates/x0k-test-process", "crates/x0k-ui-tauri", "crates/x0k-ui-tauri/probe-app", "crates/x0k-ui-protocol-wasm",
]
default-members = ["crates/x0k-ui-protocol", "crates/x0k-ui-endpoint", "crates/x0k-operation-session", "crates/x0k-operation-wire", "crates/x0k-runtime-dir", "crates/x0k-test-process", "crates/x0k-ui-protocol-wasm",
]

[workspace.package]
edition = "2021"

[workspace.dependencies]
dirs = "5.0"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
